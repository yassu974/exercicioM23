name: Run Cypress and Publish Report

on:
  push:
    branches:
      - main
      - 'chore/gha-cypress-pages*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm i

      - name: Run Cypress (headless)
        continue-on-error: true
        run: npx cypress run --browser chrome --headless

      - name: Merge Mochawesome JSON
        if: ${{ always() }}
        run: |
          mkdir -p cypress/reports
          npx mochawesome-merge "cypress/reports/**/*.json" > cypress/reports/merged.json

      - name: Generate HTML report
        if: ${{ always() }}
        run: |
          mkdir -p cypress/reports/html
          npx marge cypress/reports/merged.json \
            --reportDir cypress/reports/html \
            --reportTitle "Cypress Report" \
            --inline true --charts true

      - name: Prepare artifact for GitHub Pages
        if: ${{ always() }}
        run: |
          mkdir -p public
          if [ -f "cypress/reports/html/index.html" ]; then
            cp -r cypress/reports/html/* public/
          else
            echo "<h1>Cypress Report</h1><p>Relatório não encontrado.</p>" > public/index.html
          fi

      - name: Upload Pages artifact
        if: ${{ always() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4