name: Run Cypress and Publish Report

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm i

      - name: Run Cypress (headless chrome)
        continue-on-error: true
        run: npx cypress run --browser chrome --headless

      - name: Merge mochawesome JSON
        run: |
          npx mochawesome-merge 'cypress/reports/*.json' > cypress/reports/merged.json || true

      - name: Generate HTML report
        run: |
          npx marge cypress/reports/merged.json \
            --reportDir cypress/reports/html \
            --inline true --charts true || true

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          if [ -d "cypress/reports/html" ]; then
            cp -r cypress/reports/html/* public/ || true
          fi
          # fallback para garantir index.html
          if [ ! -f public/index.html ]; then
            echo "<h1>Cypress Report</h1><p>Relatório não encontrado. Verifique os passos anteriores.</p>" > public/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
